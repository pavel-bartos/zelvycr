name: Deploy na Vedos (novy.zelvycr.cz)

# Nasazuje dist/ na Vedos hosting do složky www/domains/novy.zelvycr.cz/ přes FTPS.
# Triggered při každém push do main — paralelně s Pages deployem.
# pathPrefix=/ protože novy.zelvycr.cz běží v kořeni domény.
#
# Potřebné GitHub Secrets:
#   VEDOS_HOST  — adresa FTP serveru (tvar 123456.w78.wedos.net)
#   VEDOS_USER  — login FTP účtu (tvar w123456)
#   VEDOS_PASS  — heslo FTP účtu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vedos-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build (pathPrefix=/ pro custom doménu)
        run: npm run build
        env:
          PATH_PREFIX: /
      - name: Instalace lftp
        run: sudo apt-get install -y -q lftp
      - name: Deploy na Vedos přes FTPS (lftp)
        env:
          VEDOS_HOST: ${{ secrets.VEDOS_HOST }}
          VEDOS_USER: ${{ secrets.VEDOS_USER }}
          VEDOS_PASS: ${{ secrets.VEDOS_PASS }}
        run: |
          lftp -u "$VEDOS_USER","$VEDOS_PASS" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate false;
            mirror --reverse --delete --parallel=4 ./dist/ /www/domains/novy.zelvycr.cz/;
            bye
          " ftp://$VEDOS_HOST
